
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Ways to Say I Love You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090616;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="loveCanvas"></canvas>

<script>

const canvas = document.getElementById("loveCanvas");
const ctx = canvas.getContext("2d");

const phrases = [
"I love you",
"I adore you",
"You mean the world to me",
"My heart belongs to you",
"You make my world brighter",
"I'm lucky to have you",
"You are my favorite person",
"I cherish you",
"You make every day better",
"I care about you deeply",
"You are always in my thoughts",
"You make my heart happy",
"I feel at home with you",
"You are precious to me",
"I appreciate everything about you",
"You bring joy into my life",
"I choose you every day",
"You are one of a kind",
"My life is better with you",
"I am grateful for you",
"You have my heart",
"You make me smile",
"I believe in you",
"I am always cheering for you",
"You inspire me",
"I love being around you",
"You make moments special",
"I treasure our memories",
"You are my happy place",
"I will always care about you",
"You make life beautiful",
"I love your kind heart",
"You are amazing",
"I am thankful for you",
"You make everything better",
"I admire you",
"You are a gift in my life",
"I feel lucky to know you",
"You brighten my days",
"I value you",
"You are unforgettable",
"I love your beautiful mind",
"You make me feel understood",
"I want the best for you",
"You are important to me",
"You make my heart full",
"I love who you are",
"You deserve happiness",
"I am proud of you",
"You make life easier",
"I cherish every moment",
"You are beautiful to me",
"I love your laugh",
"I love your smile",
"You brighten my world",
"I never take you for granted",
"You matter so much",
"I am grateful for you",
"You make my world warmer",
"I love sharing moments",
"You are truly special",
"I am happy to know you",
"You bring out the best in me",
"I appreciate you",
"You make every conversation special",
"You are in my heart",
"You are my reason to smile",
"I love the real you",
"You make my world colorful",
"I love your kindness",
"You deserve every good thing",
"I feel lucky to have you",
"You make my future brighter",
"I choose you",
"You are appreciated",
"I love every moment with you",
"You make happiness simple",
"I am glad you exist",
"You are close to my heart",
"I care about your dreams",
"Your happiness matters",
"I love your presence",
"You make the world kinder",
"I am grateful for who you are",
"You make memories special",
"I see the good in you",
"You are worth celebrating",
"I love your soul",
"You bring me peace",
"I am lucky to share this world",
"You are my favorite hello",
"I notice the little things",
"You make every moment count",
"I wish you endless happiness",
"You are loved",
"I am thankful for you",
"You make life sweeter",
"I love you beyond words",
"Simply, I love you"
];

// Animation settings
const INTERVAL = 100;
const DURATION = 550;
const HOLD_TIME = 2500;

let revealed = 0;
let startTime = 0;
let lastReveal = 0;
let completedAt = 0;
let animationFrame;

const stars = [];

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createStars();
}

function createStars() {

    stars.length = 0;

    for (let i = 0; i < 65; i++) {

        stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 1.8 + 0.4,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function background(w, h, time) {

    const gradient = ctx.createRadialGradient(
        w / 2, h / 2, 10,
        w / 2, h / 2, Math.max(w, h) * .8
    );

    gradient.addColorStop(0, "#241334");
    gradient.addColorStop(.55, "#120b22");
    gradient.addColorStop(1, "#070511");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    stars.forEach(star => {

        const alpha =
            .25 + .45 * Math.sin(time / 900 + star.phase);

        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#e6c6ed";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

function drawRing(cx, cy, radius, time) {

    // Main outer ring

    ctx.beginPath();

    ctx.arc(
        cx, cy, radius,
        0, Math.PI * 2
    );

    ctx.strokeStyle = "#c6a36b";
    ctx.lineWidth = 1.3;
    ctx.shadowColor = "#d9b477";
    ctx.shadowBlur = 12;

    ctx.stroke();

    ctx.shadowBlur = 0;

    // Inner ring

    ctx.beginPath();

    ctx.arc(
        cx, cy, radius * .57,
        0, Math.PI * 2
    );

    ctx.strokeStyle = "rgba(215,180,220,.35)";
    ctx.lineWidth = 1;

    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawCenter(cx, cy, radius) {

    ctx.beginPath();

    ctx.arc(
        cx, cy, radius * .53,
        0, Math.PI * 2
    );

    const gradient = ctx.createRadialGradient(
        cx, cy, 0,
        cx, cy, radius * .53
    );

    gradient.addColorStop(0, "#251431");
    gradient.addColorStop(1, "#10091f");

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.strokeStyle = "rgba(210,170,210,.35)";
    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e8c98c";
    ctx.font = "bold 10px Georgia";
    ctx.letterSpacing = "3px";

    ctx.fillText(
        "100 WAYS TO SAY",
        cx,
        cy - radius * .20
    );

    ctx.fillStyle = "#fff0f8";
    ctx.font = `bold ${Math.max(17, radius * .105)}px Georgia`;

    ctx.fillText(
        "I LOVE YOU",
        cx,
        cy - radius * .04
    );

    ctx.fillStyle = "#e6b9d9";
    ctx.font = "italic 13px Georgia";

    ctx.fillText(
        "♥",
        cx,
        cy + radius * .13
    );

    ctx.fillStyle = "#c8a878";
    ctx.font = "10px Georgia";

    ctx.fillText(
        `${revealed} / 100`,
        cx,
        cy + radius * .28
    );
}

function drawPhrase(index, cx, cy, radius, time) {

    const item = index;
    const appearedAt = startTime + item * INTERVAL;

    const elapsed = time - appearedAt;

    if (elapsed < 0) return;

    const progress = Math.min(elapsed / DURATION, 1);

    // Smooth fade and movement

    const ease = 1 - Math.pow(1 - progress, 3);

    const angle =
        (Math.PI * 2 * item / phrases.length)
        - Math.PI / 2;

    const inner = radius * .60;
    const outer = radius * .91;

    const distance =
        inner + (outer - inner) * ease;

    const x = cx + Math.cos(angle) * distance;
    const y = cy + Math.sin(angle) * distance;

    ctx.save();

    ctx.translate(x, y);

    // Rotate text around the circle

    ctx.rotate(angle + Math.PI / 2);

    ctx.globalAlpha = progress;

    const color = item % 5 === 0
        ? "#e6c88e"
        : "#d8a8d5";

    ctx.fillStyle = color;

    ctx.shadowColor = color;
    ctx.shadowBlur = 7 * progress;

    ctx.font = `${Math.max(7, Math.min(10, radius * .022))}px Georgia`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        phrases[item],
        0,
        0,
        radius * .65
    );

    ctx.restore();
}

function draw(time) {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w / 2;
    const cy = h / 2;

    const radius = Math.min(w, h) * .37;

    background(w, h, time);

    drawRing(cx, cy, radius, time);

    // Reveal one phrase every 0.1 seconds

    if (revealed < phrases.length) {

        if (time - lastReveal >= INTERVAL) {

            revealed++;
            lastReveal = time;
        }
    }

    // Draw all revealed phrases

    for (let i = 0; i < revealed; i++) {

        drawPhrase(i, cx, cy, radius, time);
    }

    drawCenter(cx, cy, radius);

    // Restart the animation after completion

    if (revealed === phrases.length) {

        if (completedAt === 0) {
            completedAt = time;
        }

        if (time - completedAt >= HOLD_TIME) {

            revealed = 0;
            startTime = time;
            lastReveal = time;
            completedAt = 0;
        }
    }

    animationFrame = requestAnimationFrame(draw);
}

function start() {

    resize();

    startTime = performance.now();
    lastReveal = startTime;

    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

start();

</script>

</body>
</html>
