
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100719">
<title>My Flower of Love</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #100719;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<canvas id="flower"></canvas>

<script>

// =====================================
// LOVE WORDS
// =====================================

const rootWords = [
"My Love", "Forever", "Always",
"My Heart", "Beloved", "True Love",
"My World", "My Everything", "Only You",
"My Darling", "Endless Love", "My Angel"
];

const stemWords = [
"My Sweetheart", "My Sunshine",
"My Happiness", "My Favorite",
"My Precious", "My Dream",
"My Dearest", "My Joy",
"My Beautiful", "My Treasure",
"My One & Only", "My Forever"
];

const leafWords = [
"My Cutie", "Sweetie",
"My Bunny", "My Baby",
"My Little Star", "My Sunshine",
"My Sweet Girl", "My Flower",
"My Lovebug", "My Teddy",
"My Honey", "My Treasure"
];

const petals = [
["My Princess", "My Darling", "My Angel", "My Sweetheart"],
["My Baby", "My Cutie", "My Precious", "My Love"],
["My Queen", "My Beautiful", "My Dearest", "My Heart"],
["My Kitten", "My Sweetie", "My Sunshine", "My Girl"],
["My Bunny", "My Angel", "My Baby", "My World"],
["My Flower", "My Princess", "My Cutie", "My Darling"],
["My Lovebug", "My Honey", "My Sweetheart", "My Dream"],
["My Little Girl", "My Treasure", "My Queen", "My Everything"],
["My Pretty Girl", "My Baby", "My Sunshine", "My Angel"],
["My Favorite", "My Sweet Girl", "My Princess", "My Love"]
];

const centerWords = [
"I LOVE YOU",
"MY LOVE",
"FOREVER",
"MY PRINCESS"
];

// =====================================
// CANVAS
// =====================================

const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

let W, H, DPR;
let stars = [];
let slots = [];

let startTime = 0;
let completedAt = 0;
let visibleWords = 0;

const TOTAL_TIME = 5000;
const RESTART_DELAY = 2500;

// =====================================
// RESIZE
// =====================================

function resize() {

    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    createStars();
    createSlots();
}

// =====================================
// STAR BACKGROUND
// =====================================

function createStars() {

    stars = [];

    for (let i = 0; i < 65; i++) {

        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.5 + 0.4,
            phase: Math.random() * 6
        });
    }
}

function drawBackground(time) {

    const gradient = ctx.createRadialGradient(
        W / 2, H / 2, 10,
        W / 2, H / 2, Math.max(W, H) * 0.8
    );

    gradient.addColorStop(0, "#291637");
    gradient.addColorStop(0.55, "#160b24");
    gradient.addColorStop(1, "#090512");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    stars.forEach(star => {

        ctx.globalAlpha =
            0.2 + 0.4 * Math.sin(time / 900 + star.phase);

        ctx.fillStyle = "#eac8f0";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

// =====================================
// CREATE WORD POSITIONS
// =====================================

function createSlots() {

    slots = [];

    const cx = 0.5;
    const flowerY = 0.29;

    // 1. ROOTS - bottom branches

    const rootBranches = [
        { x: -0.28, y: 0.91 },
        { x: -0.14, y: 0.88 },
        { x: 0, y: 0.93 },
        { x: 0.14, y: 0.88 },
        { x: 0.28, y: 0.91 }
    ];

    rootBranches.forEach((branch, b) => {

        for (let i = 0; i < 2; i++) {

            const t = i / 2;

            slots.push({
                word: rootWords[b * 2 + i],
                x: cx + branch.x * (0.45 + t * 0.55),
                y: 0.77 + (branch.y - 0.77) * (0.5 + t * 0.5),
                type: "root"
            });
        }
    });

    // 2. MAIN STEM

    stemWords.forEach((word, i) => {

        const t = i / (stemWords.length - 1);

        slots.push({
            word,
            x: cx + Math.sin(t * Math.PI * 5) * 0.012,
            y: 0.75 - t * 0.30,
            type: "stem"
        });
    });

    // 3. LEAVES

    const leafPositions = [
        [0.36, 0.64], [0.31, 0.61], [0.35, 0.57],
        [0.64, 0.64], [0.69, 0.61], [0.65, 0.57],
        [0.40, 0.70], [0.33, 0.68], [0.37, 0.66],
        [0.60, 0.70], [0.67, 0.68], [0.63, 0.66]
    ];

    leafWords.forEach((word, i) => {

        slots.push({
            word,
            x: leafPositions[i][0],
            y: leafPositions[i][1],
            type: "leaf"
        });
    });

    // 4. FLOWER PETALS

    const flowerRadius = Math.min(W * 0.43, H * 0.19);

    petals.forEach((petal, p) => {

        const angle =
            p * (Math.PI * 2 / petals.length)
            - Math.PI / 2;

        const distances = [0.30, 0.42, 0.54, 0.66];

        petal.forEach((word, j) => {

            const d = flowerRadius * distances[j];

            const side =
                (j === 1 ? -1 : j === 2 ? 1 : 0)
                * flowerRadius * 0.045;

            const x =
                cx * W +
                Math.cos(angle) * d -
                Math.sin(angle) * side;

            const y =
                flowerY * H +
                Math.sin(angle) * d +
                Math.cos(angle) * side;

            slots.push({
                word,
                x: x / W,
                y: y / H,
                type: "petal"
            });
        });
    });

    // 5. FLOWER CENTER

    centerWords.forEach((word, i) => {

        const positions = [
            [-0.045, -0.015],
            [0.045, -0.015],
            [-0.045, 0.025],
            [0.045, 0.025]
        ];

        slots.push({
            word,
            x: cx + positions[i][0],
            y: flowerY + positions[i][1],
            type: "center"
        });
    });
}

// =====================================
// DRAW WORDS
// =====================================

function drawWord(slot, index, time) {

    const appearanceTime =
        startTime + index * (TOTAL_TIME / slots.length);

    const age = time - appearanceTime;

    if (age < 0) return;

    const progress = Math.min(age / 220, 1);

    const ease = 1 - Math.pow(1 - progress, 3);

    const x = slot.x * W;
    const y = slot.y * H;

    const fontSize =
        slot.type === "petal" ? 10 :
        slot.type === "center" ? 11 :
        slot.type === "root" ? 11 : 10;

    const colors = {
        root: "#d9c5a0",
        stem: "#c4d4a2",
        leaf: "#d4e6ae",
        petal: "#f5c8ed",
        center: "#ffe2f4"
    };

    ctx.save();

    ctx.globalAlpha = ease;

    ctx.translate(x, y - (1 - ease) * 8);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = `bold ${fontSize}px Georgia`;

    ctx.fillStyle = colors[slot.type];

    ctx.shadowColor =
        slot.type === "leaf" || slot.type === "stem"
        ? "#a6c88b"
        : "#e89bd8";

    ctx.shadowBlur = 9;

    ctx.fillText(slot.word, 0, 0, W * 0.18);

    ctx.restore();
}

// =====================================
// STEM AND ROOT LINES
// =====================================

function drawPlantStructure(progress) {

    const cx = W * 0.5;
    const baseY = H * 0.77;
    const flowerY = H * 0.43;

    ctx.save();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Main stem

    const stemProgress = Math.max(
        0,
        Math.min(1, (progress - 0.15) / 0.18)
    );

    if (stemProgress > 0) {

        ctx.beginPath();
        ctx.moveTo(cx, baseY);

        ctx.quadraticCurveTo(
            cx + 12,
            H * 0.61,
            cx,
            flowerY
        );

        ctx.lineWidth = 2;
        ctx.strokeStyle = `rgba(156,190,123,${stemProgress * 0.55})`;

        ctx.stroke();
    }

    // Roots

    const rootProgress = Math.min(1, progress / 0.16);

    const rootEnds = [
        [cx - W * 0.27, H * 0.92],
        [cx - W * 0.14, H * 0.89],
        [cx, H * 0.94],
        [cx + W * 0.14, H * 0.89],
        [cx + W * 0.27, H * 0.92]
    ];

    rootEnds.forEach((end, i) => {

        ctx.beginPath();

        ctx.moveTo(cx, baseY);

        ctx.quadraticCurveTo(
            cx + (end[0] - cx) * 0.35,
            H * 0.83,
            cx + (end[0] - cx) * rootProgress,
            baseY + (end[1] - baseY) * rootProgress
        );

        ctx.lineWidth = 1.5;

        ctx.strokeStyle =
            `rgba(195,151,180,${rootProgress * 0.55})`;

        ctx.stroke();
    });

    ctx.restore();
}

// =====================================
// HEART CENTER
// =====================================

function drawHeart(time) {

    const cx = W * 0.5;
    const cy = H * 0.29;

    const pulse = 1 + Math.sin(time / 240) * 0.07;

    ctx.save();

    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    ctx.font = "30px Georgia";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#f6b5df";
    ctx.shadowColor = "#e98bce";
    ctx.shadowBlur = 20;

    ctx.fillText("♥", 0, 0);

    ctx.restore();
}

// =====================================
// ANIMATION
// =====================================

function animate(time) {

    drawBackground(time);

    const elapsed = time - startTime;

    const progress = Math.min(elapsed / TOTAL_TIME, 1);

    // Draw plant structure gradually

    drawPlantStructure(progress);

    // Reveal words one by one

    visibleWords = Math.min(
        slots.length,
        Math.floor(progress * slots.length) + 1
    );

    for (let i = 0; i < visibleWords; i++) {

        drawWord(slots[i], i, time);
    }

    // Heart appears with the flower

    if (progress > 0.75) {
        drawHeart(time);
    }

    // Restart

    if (visibleWords >= slots.length) {

        if (completedAt === 0) {
            completedAt = time;
        }

        if (time - completedAt >= RESTART_DELAY) {

            startTime = time;
            completedAt = 0;
            visibleWords = 0;
        }
    }

    requestAnimationFrame(animate);
}

// =====================================
// START
// =====================================

window.addEventListener("resize", resize);

resize();

startTime = performance.now();

requestAnimationFrame(animate);

</script>

</body>
</html>
