
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100719">
<title>My Flower of Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#100719}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="flower"></canvas>
<script>

const canvas=document.getElementById("flower");
const ctx=canvas.getContext("2d");

const loveWords=[
"My Princess","My Baby","My Kitten","My Cutie",
"My Darling","My Angel","My Queen","My Sweetheart",
"My Love","My Precious","My Bunny","My Sunshine",
"My Little Girl","My Pretty Girl","My Honey","My Heart",
"My Sweetie","My Flower","My Lovebug","My Everything",
"My World","My Favorite","My Dream","My Treasure",
"My Beautiful","My Dearest","My Sweet Girl","My Star",
"My Angel Baby","My Lovely Girl","My One & Only",
"My Happiness","My Forever","My Gorgeous Girl",
"My Teddy","My Butterfly","My Little Star",
"My Sweet Princess","My Heartbeat","My Adorable Girl",
"My Moonlight","My Rose","My Lovely Angel",
"My Baby Girl","My Beloved","My Special One",
"My Sunshine Girl","My Sweet Love","My Cutie Pie",
"My Little Angel","My Precious Girl","My Darling Baby",
"My Queen","My Everything","I Love You",
"I Adore You","Forever Yours","Only You",
"My World","My Soul","My Happiness","My Sweetheart"
];

const rootWords=[
"My Love","Forever","Always","My Heart",
"My Everything","Only You","True Love","My World",
"My Darling","My Angel","My Baby","My Princess"
];

const stemWords=[
"My Sweetheart","My Sunshine","My Happiness",
"My Precious","My Dream","My Dearest",
"My Favorite","My Forever"
];

const leafWords=[
"My Cutie","My Bunny","My Baby","My Honey",
"My Sweetie","My Flower","My Angel","My Love"
];

let W,H,DPR,stars=[];
let startTime=0,finishedAt=0;
let slots=[];

const DURATION=5000;
const WAIT=2500;
const PETALS=12;

function resize(){
DPR=Math.min(devicePixelRatio||1,2);
W=innerWidth;H=innerHeight;
canvas.width=W*DPR;
canvas.height=H*DPR;
ctx.setTransform(DPR,0,0,DPR,0,0);
createStars();
createSlots();
}

function createStars(){
stars=[];
for(let i=0;i<65;i++){
stars.push({
x:Math.random()*W,
y:Math.random()*H,
r:Math.random()*1.5+.4,
p:Math.random()*6
});
}
}

function background(t){
let g=ctx.createRadialGradient(W/2,H*.43,5,W/2,H*.43,Math.max(W,H)*.8);
g.addColorStop(0,"#30183e");
g.addColorStop(.55,"#180d27");
g.addColorStop(1,"#080511");
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);

stars.forEach(s=>{
ctx.globalAlpha=.2+.4*Math.sin(t/900+s.p);
ctx.fillStyle="#f1d7fa";
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
});
ctx.globalAlpha=1;
}

// ==================================
// WORD POSITIONS
// ==================================

function createSlots(){

slots=[];

const cx=W*.5;
const flowerY=H*.32;
const radius=Math.min(W*.31,H*.145);

// ROOTS FIRST

const roots=[
[-.27,.91],[-.21,.94],[-.14,.89],
[-.08,.95],[0,.92],[.08,.95],
[.14,.89],[.21,.94],[.27,.91],
[-.12,.87],[.12,.87],[0,.97]
];

rootWords.forEach((word,i)=>{
slots.push({
word,
x:cx+roots[i][0]*W,
y:roots[i][1]*H,
type:"root"
});
});

// STEM

stemWords.forEach((word,i)=>{
const p=i/7;
slots.push({
word,
x:cx+Math.sin(p*Math.PI*3)*W*.012,
y:H*(.79-p*.38),
type:"stem"
});
});

// LEAVES

const leaves=[
[.39,.65], [.35,.62], [.38,.59], [.43,.56],
[.61,.65], [.65,.62], [.62,.59], [.57,.56]
];

leafWords.forEach((word,i)=>{
slots.push({
word,
x:W*leaves[i][0],
y:H*leaves[i][1],
type:"leaf"
});
});

// 12 SEPARATE PETALS
// Each petal has five words.

let wordIndex=0;

for(let p=0;p<PETALS;p++){

const angle=p*Math.PI*2/PETALS-Math.PI/2;

const distances=[.19,.37,.55,.73,.89];

distances.forEach((d,j)=>{

const side=(j%2===0?-.08:.08)*radius;

const x=cx+
Math.cos(angle)*radius*d-
Math.sin(angle)*side;

const y=flowerY+
Math.sin(angle)*radius*d+
Math.cos(angle)*side;

slots.push({
word:loveWords[wordIndex++],
x,y,
type:"petal"
});

});
}

// CENTER

slots.push({
word:"MY PRINCESS",
x:cx,
y:flowerY,
type:"center"
});

}

// ==================================
// DRAW A REAL PETAL SHAPE
// ==================================

function drawPetal(cx,cy,angle,radius,alpha){

ctx.save();
ctx.translate(cx,cy);
ctx.rotate(angle);

ctx.beginPath();

// Base of petal
ctx.moveTo(0,0);

// Left edge
ctx.bezierCurveTo(
-radius*.12,-radius*.25,
-radius*.32,-radius*.55,
0,-radius
);

// Right edge
ctx.bezierCurveTo(
radius*.32,-radius*.55,
radius*.12,-radius*.25,
0,0
);

ctx.closePath();

const gradient=ctx.createLinearGradient(0,0,0,-radius);
gradient.addColorStop(0,`rgba(238,170,220,${alpha*.17})`);
gradient.addColorStop(1,`rgba(204,128,210,${alpha*.025})`);

ctx.fillStyle=gradient;
ctx.fill();

ctx.strokeStyle=`rgba(240,184,225,${alpha*.55})`;
ctx.lineWidth=1.1;
ctx.shadowColor="#df8acb";
ctx.shadowBlur=10;
ctx.stroke();

ctx.restore();
}

// ==================================
// FLOWER STRUCTURE
// ==================================

function drawFlowerShape(progress){

const cx=W*.5;
const cy=H*.32;
const radius=Math.min(W*.31,H*.145);

// Petals appear one by one

for(let i=0;i<PETALS;i++){

const threshold=.35+(i/PETALS)*.48;

if(progress>threshold){

const alpha=Math.min(1,(progress-threshold)*8);

const angle=i*Math.PI*2/PETALS-Math.PI/2;

drawPetal(cx,cy,angle,radius,alpha);
}
}

// Small flower center

if(progress>.85){

ctx.beginPath();
ctx.arc(cx,cy,radius*.12,0,Math.PI*2);
ctx.fillStyle="rgba(244,190,222,.25)";
ctx.fill();

ctx.strokeStyle="#f0c4e0";
ctx.lineWidth=1;
ctx.stroke();

}
}

// ==================================
// STEM AND ROOTS
// ==================================

function drawPlant(progress){

const cx=W*.5;
const base=H*.79;
const top=H*.40;

ctx.save();
ctx.lineCap="round";

// Stem

if(progress>.12){

const p=Math.min(1,(progress-.12)/.25);

ctx.beginPath();
ctx.moveTo(cx,base);
ctx.quadraticCurveTo(cx+W*.025,H*.58,cx,top);

ctx.strokeStyle=`rgba(166,204,136,${p*.8})`;
ctx.lineWidth=3;
ctx.shadowColor="#a8d28c";
ctx.shadowBlur=9;
ctx.stroke();
}

// Roots

const rootProgress=Math.min(1,progress/.14);

const ends=[
[-.27,.91],[-.21,.94],[-.14,.89],
[-.08,.95],[0,.92],[.08,.95],
[.14,.89],[.21,.94],[.27,.91],
[-.12,.87],[.12,.87],[0,.97]
];

ends.forEach((e,i)=>{

ctx.beginPath();
ctx.moveTo(cx,base);

ctx.quadraticCurveTo(
cx+e[0]*W*.35,
H*.86,
cx+e[0]*W*rootProgress,
base+(e[1]*H-base)*rootProgress
);

ctx.strokeStyle=`rgba(190,157,181,${rootProgress*.8})`;
ctx.lineWidth=1.6;
ctx.stroke();

});

// Leaves

if(progress>.24){

const leaves=[
{side:-1,y:.65},{side:1,y:.65},
{side:-1,y:.59},{side:1,y:.59}
];

leaves.forEach((l,i)=>{

const p=Math.min(1,(progress-.24)*5);

ctx.beginPath();
ctx.moveTo(cx,H*l.y);
ctx.quadraticCurveTo(
cx+l.side*W*.04,H*(l.y-.06),
cx+l.side*W*.10*p,H*(l.y-.025)
);

ctx.strokeStyle=`rgba(165,205,135,${p*.8})`;
ctx.lineWidth=2;
ctx.stroke();

});
}

ctx.restore();
}

// ==================================
// WORD DRAWING
// ==================================

function drawWord(slot,index,time){

const appear=startTime+index*(DURATION/slots.length);
const age=time-appear;

if(age<0)return;

const p=Math.min(1,age/220);
const ease=1-Math.pow(1-p,3);

let size=10;

if(slot.type==="center")size=11;
if(slot.type==="petal")size=9;
if(slot.type==="root")size=9;

const color={
root:"#e9c9ad",
stem:"#d0dda9",
leaf:"#d3e7b0",
petal:"#f8c8eb",
center:"#fff0fa"
};

ctx.save();
ctx.globalAlpha=ease;
ctx.translate(slot.x,slot.y+(1-ease)*8);

ctx.font=`bold ${size}px Georgia`;
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillStyle=color[slot.type];
ctx.shadowColor=slot.type==="leaf"||slot.type==="stem"
?"#a7d18d":"#e69bdb";
ctx.shadowBlur=7;

ctx.fillText(slot.word,0,0,Math.min(W*.17,100));

ctx.restore();
}

// ==================================
// ANIMATION
// ==================================

function animate(time){

background(time);

const elapsed=time-startTime;
const progress=Math.min(1,elapsed/DURATION);

// Roots, stem and leaves

drawPlant(progress);

// Petals grow individually

drawFlowerShape(progress);

// Reveal words one by one

const count=Math.min(
slots.length,
Math.floor(progress*slots.length)+1
);

for(let i=0;i<count;i++){
drawWord(slots[i],i,time);
}

// Heart

if(progress>.90){

const pulse=1+Math.sin(time/250)*.08;

ctx.save();
ctx.translate(W*.5,H*.32);
ctx.scale(pulse,pulse);

ctx.font="19px Georgia";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillStyle="#ffdaef";
ctx.shadowColor="#ed91d1";
ctx.shadowBlur=15;
ctx.fillText("♥",0,0);

ctx.restore();
}

// Restart

if(progress>=1){

if(!finishedAt)finishedAt=time;

if(time-finishedAt>=WAIT){
startTime=time;
finishedAt=0;
}
}

requestAnimationFrame(animate);
}

window.addEventListener("resize",resize);

resize();
startTime=performance.now();

requestAnimationFrame(animate);

</script>
</body>
</html>
