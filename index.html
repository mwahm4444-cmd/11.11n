
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090616">
<title>100 Ways to Say I Love You</title>

<style>

}

html, body {

body {

}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

<body>

<canvas id="loveCanvas"></canvas>

<script>

// ========================================
// 100 WAYS TO SAY I LOVE YOU
// ========================================

const phrases = [
"I love you.",
"I adore you.",
"You mean the world to me.",
"My heart belongs to you.",
"You make my world brighter.",
"I'm so lucky to have you.",
"You are my favorite person.",
"I cherish you.",
"You make every day better.",
"I care about you deeply.",
"You are always in my thoughts.",
"You make my heart happy.",
"I feel at home with you.",
"You are precious to me.",
"I appreciate everything about you.",
"You bring joy into my life.",
"I choose you every day.",
"You are one of a kind.",
"My life is better with you.",
"I am grateful for you.",
"You have a special place in my heart.",
"You make me smile.",
"I believe in you.",
"I am always cheering for you.",
"You inspire me.",
"I love being around you.",
"You make ordinary moments special.",
"I treasure our memories.",
"You are my happy place.",
"I will always care about you.",
"You make life beautiful.",
"I love your kind heart.",
"You are amazing.",
"I am thankful for you.",
"You make everything better.",
"I admire you.",
"You are a gift in my life.",
"I feel lucky to know you.",
"You brighten my days.",
"I value you.",
"You are unforgettable.",
"I love your beautiful mind.",
"You make me feel understood.",
"I want the best for you.",
"You are important to me.",
"You make my heart feel full.",
"I love who you are.",
"You deserve happiness.",
"I am proud of you.",
"You make life easier.",
"I cherish every moment.",
"You are beautiful to me.",
"I love your laugh.",
"I love your smile.",
"You brighten my world.",
"I never take you for granted.",
"You matter so much.",
"I am grateful for your presence.",
"You make my world warmer.",
"I love sharing moments with you.",
"You are truly special.",
"I am happy to know you.",
"You bring out the best in me.",
"I appreciate you.",
"You make every conversation special.",
"You are in my heart.",
"You are my reason to smile.",
"I love the real you.",
"You make my world colorful.",
"I love your kindness.",
"You deserve every good thing.",
"I feel lucky to have you.",
"You make my future brighter.",
"I choose you.",
"You are appreciated.",
"I love every moment with you.",
"You make happiness simple.",
"I am glad you exist.",
"You are close to my heart.",
"I care about your dreams.",
"Your happiness matters to me.",
"I love your presence.",
"You make the world kinder.",
"I am grateful for who you are.",
"You make memories special.",
"I see the good in you.",
"You are worth celebrating.",
"I love your beautiful soul.",
"You bring me peace.",
"I am lucky to share this world with you.",
"You are my favorite hello.",
"I notice the little things.",
"You make every moment count.",
"I wish you endless happiness.",
"You are loved.",
"I am thankful for you.",
"You make life sweeter.",
"I love you beyond words.",
"Simply, I love you."
];

// ========================================
// CANVAS SETUP
// ========================================

const canvas = document.getElementById("loveCanvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createStars();
}

// ========================================
// ANIMATION SETTINGS
// ========================================

const INTERVAL = 100;
const COMPLETE_WAIT = 2500;

let revealed = 0;
let lastReveal = 0;
let completedAt = 0;

let currentPhrase = phrases[0];
let phraseOpacity = 1;

let stars = [];

// ========================================
// BACKGROUND STARS
// ========================================

function createStars() {

    stars = [];

    for (let i = 0; i < 65; i++) {

        stars.push({

            x: Math.random() * width,
            y: Math.random() * height,

            size: Math.random() * 1.8 + 0.5,

            phase: Math.random() * Math.PI * 2,

            speed: Math.random() * 0.002 + 0.001

        });
    }
}

function drawBackground(time) {

    const gradient = ctx.createRadialGradient(
        width / 2,
        height / 2,
        10,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.8
    );

    gradient.addColorStop(0, "#261438");
    gradient.addColorStop(0.55, "#130b23");
    gradient.addColorStop(1, "#070511");

    ctx.fillStyle = gradient;

    ctx.fillRect(0, 0, width, height);

    // Stars

    stars.forEach(star => {

        const opacity =
            0.25 + 0.45 *
            Math.sin(time * star.speed + star.phase);

        ctx.globalAlpha = opacity;

        ctx.fillStyle = "#e8c7ef";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

// ========================================
// OUTER CIRCLES
// ========================================

function drawRings(cx, cy, radius, time) {

    // Outer golden circle

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#d8b477";
    ctx.lineWidth = 1.4;

    ctx.shadowColor = "#e4c17e";
    ctx.shadowBlur = 14;

    ctx.stroke();

    ctx.shadowBlur = 0;

    // Inner dotted circle

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 0.57,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "rgba(220,180,220,0.35)";
    ctx.lineWidth = 1.2;

    ctx.setLineDash([4, 7]);
    ctx.stroke();

    ctx.setLineDash([]);

    // Inner circle

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 0.53,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "rgba(225,190,220,0.45)";
    ctx.lineWidth = 1;

    ctx.stroke();
}

// ========================================
// 100 PROGRESS DOTS
// ========================================

function drawProgressDots(cx, cy, radius, time) {

    for (let i = 0; i < 100; i++) {

        const angle =
            (Math.PI * 2 * i / 100)
            - Math.PI / 2;

        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;

        const active = i < revealed;

        const dotSize = active ? 2.5 : 1.8;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            dotSize,
            0,
            Math.PI * 2
        );

        if (active) {

            ctx.fillStyle = "#f4c5e8";

            ctx.shadowColor = "#e7a4e4";
            ctx.shadowBlur = 12;

        } else {

            ctx.fillStyle = "rgba(210,180,220,0.22)";

            ctx.shadowBlur = 0;
        }

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

// ========================================
// TEXT WRAPPING
// ========================================

function wrapText(text, maxWidth, fontSize) {

    ctx.font = `bold ${fontSize}px Georgia`;

    const words = text.split(" ");

    const lines = [];

    let line = "";

    for (const word of words) {

        const testLine = line
            ? line + " " + word
            : word;

        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && line) {

            lines.push(line);

            line = word;

        } else {

            line = testLine;
        }
    }

    if (line) {
        lines.push(line);
    }

    return lines;
}

// ========================================
// CENTER DESIGN
// ========================================

function drawCenter(cx, cy, radius, time) {

    const centerRadius = radius * 0.53;

    // Center background

    const gradient = ctx.createRadialGradient(
        cx,
        cy,
        0,
        cx,
        cy,
        centerRadius
    );

    gradient.addColorStop(0, "#352044");
    gradient.addColorStop(1, "#10091f");

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        centerRadius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradient;

    ctx.fill();

    ctx.strokeStyle = "rgba(230,190,225,0.55)";
    ctx.lineWidth = 1.4;

    ctx.stroke();

    // Small heart

    const heartPulse =
        1 + Math.sin(time / 250) * 0.08;

    ctx.save();

    ctx.translate(cx, cy - radius * 0.27);
    ctx.scale(heartPulse, heartPulse);

    ctx.font = "30px Georgia";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#f3b5dc";

    ctx.shadowColor = "#e58acb";
    ctx.shadowBlur = 16;

    ctx.fillText("♥", 0, 0);

    ctx.restore();

    ctx.shadowBlur = 0;

    // Heading

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e7c88e";

    ctx.font = "bold 11px Georgia";

    ctx.fillText(
        "100 WAYS TO SAY",
        cx,
        cy - radius * 0.12
    );

    // Main heading

    ctx.fillStyle = "#fff0fa";

    ctx.font = `bold ${Math.max(19, radius * 0.105)}px Georgia`;

    ctx.fillText(
        "I LOVE YOU",
        cx,
        cy + radius * 0.015
    );

    // Current phrase

    const availableWidth = radius * 0.85;

    let fontSize = Math.max(
        13,
        Math.min(19, radius * 0.065)
    );

    let lines = wrapText(
        currentPhrase,
        availableWidth,
        fontSize
    );

    while (lines.length > 3 && fontSize > 12) {

        fontSize--;

        lines = wrapText(
            currentPhrase,
            availableWidth,
            fontSize
        );
    }

    ctx.font = `bold ${fontSize}px Georgia`;

    ctx.fillStyle = "#f5d9ef";

    ctx.shadowColor = "#d98bce";
    ctx.shadowBlur = 10;

    const lineHeight = fontSize * 1.35;

    const startY =
        cy + radius * 0.17
        - ((lines.length - 1) * lineHeight) / 2;

    lines.forEach((line, index) => {

        ctx.fillText(
            line,
            cx,
            startY + index * lineHeight
        );
    });

    ctx.shadowBlur = 0;

    // Counter

    ctx.fillStyle = "#e6c88e";

    ctx.font = "12px Georgia";

    ctx.fillText(
        `${String(revealed).padStart(2, "0")} / 100`,
        cx,
        cy + radius * 0.35
    );
}

// ========================================
// ANIMATION
// ========================================

function updateAnimation(time) {

    if (revealed < 100) {

        if (time - lastReveal >= INTERVAL) {

            revealed++;

            currentPhrase = phrases[revealed - 1];

            lastReveal = time;
        }

    } else {

        if (completedAt === 0) {

            completedAt = time;
        }

        if (time - completedAt >= COMPLETE_WAIT) {

            revealed = 0;

            currentPhrase = phrases[0];

            lastReveal = time;

            completedAt = 0;
        }
    }
}

// ========================================
// MAIN DRAW LOOP
// ========================================

function draw(time) {

    updateAnimation(time);

    const cx = width / 2;
    const cy = height / 2;

    const radius = Math.min(width, height) * 0.36;

    // Clear and draw background

    drawBackground(time);

    // Draw circular design

    drawRings(cx, cy, radius, time);

    // Draw progress around circle

    drawProgressDots(
        cx,
        cy,
        radius,
        time
    );

    // Draw readable phrase in center

    drawCenter(
        cx,
        cy,
        radius,
        time
    );

    requestAnimationFrame(draw);
}

// ========================================
// START
// ========================================

window.addEventListener("resize", resize);

resize();

lastReveal = performance.now();

requestAnimationFrame(draw);

</script>

</body>
</html>
