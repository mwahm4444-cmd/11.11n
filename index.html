
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100719">
<title>100 Words of Love</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #100719;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>

<canvas id="flower"></canvas>

<script>

const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

// 100 individual words

const words = [
"LOVE","ALWAYS","FOREVER","DEAR","HEART",
"BEAUTIFUL","SWEET","ANGEL","DARLING","PRECIOUS",
"MY LOVE","HAPPINESS","DREAM","SUNSHINE","JOY",
"CHERISH","ADORE","KINDNESS","MAGIC","SPECIAL",
"HEAVEN","SMILE","WONDER","TENDER","PURE",
"ENDLESS","ROMANCE","SOUL","WARMTH","GENTLE",
"PERFECT","TREASURE","GLOW","HOPE","BLISS",
"BELOVED","PASSION","HONEY","STAR","FLOWER",
"DEVOTION","GRACE","PEACE","HEARTBEAT","GOLD",
"INFINITE","CUDDLE","SINCERE","LOVELY","AMAZING",
"TOGETHER","SUNRISE","MOONLIGHT","RAINBOW","HUGS",
"MY WORLD","FAVORITE","SWEETHEART","BLOSSOM","MAGNIFICENT",
"FAITH","WISH","LAUGHTER","DELIGHT","GORGEOUS",
"TRUST","CARE","DREAMY","SERENITY","LIGHT",
"FOREVERMORE","HARMONY","GIFT","BLUSH","STARDUST",
"MY ANGEL","MY HEART","MY EVERYTHING","ENDLESS JOY",
"ETERNAL","PRECIOUS","SOULMATE","WONDERFUL",
"INSPIRATION","TULIP","ROSE","PETAL","BLOOM",
"DEAREST","GLOWING","DIVINE","UNIQUE","PURE LOVE",
"MY SUNSHINE","SWEET SOUL","HEART OF GOLD",
"ONLY YOU","I LOVE YOU"
];

// Settings

const TOTAL_WORDS = words.length;
const TOTAL_TIME = 5000;
const RESTART_DELAY = 2500;

let width, height, dpr;
let startTime = 0;
let finishedAt = 0;
let visibleWords = 0;
let stars = [];

// Resize

function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createStars();
}

// Background stars

function createStars() {

    stars = [];

    for (let i = 0; i < 65; i++) {

        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5 + 0.4,
            phase: Math.random() * 6
        });
    }
}

function drawBackground(time) {

    const bg = ctx.createRadialGradient(
        width / 2,
        height / 2,
        10,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.8
    );

    bg.addColorStop(0, "#291637");
    bg.addColorStop(0.55, "#160b24");
    bg.addColorStop(1, "#090512");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    stars.forEach(star => {

        ctx.globalAlpha =
            0.2 + 0.4 *
            Math.sin(time / 900 + star.phase);

        ctx.fillStyle = "#eac8f0";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

// Calculate each word's position
// 16 petals, 6 words in each petal

function getWordPosition(index, cx, cy, radius) {

    if (index >= 96) {

        const a = (index - 96) * Math.PI / 2;

        return {
            x: cx + Math.cos(a) * radius * 0.09,
            y: cy + Math.sin(a) * radius * 0.09
        };
    }

    const petal = Math.floor(index / 6);
    const slot = index % 6;

    const level = Math.floor(slot / 2);
    const side = slot % 2 === 0 ? -1 : 1;

    const angle =
        petal * (Math.PI * 2 / 16)
        + side * (0.09 + level * 0.025);

    const distance =
        radius * (0.25 + level * 0.255);

    return {
        x: cx + Math.cos(angle) * distance,
        y: cy + Math.sin(angle) * distance
    };
}

// Draw one word

function drawWord(index, cx, cy, radius, time) {

    const position = getWordPosition(
        index,
        cx,
        cy,
        radius
    );

    const appearTime =
        startTime + index * (TOTAL_TIME / TOTAL_WORDS);

    const age = time - appearTime;

    if (age < 0) return;

    const progress = Math.min(age / 250, 1);

    const ease =
        1 - Math.pow(1 - progress, 3);

    const fontSize = Math.max(
        9,
        Math.min(13, radius * 0.031)
    );

    ctx.save();

    ctx.globalAlpha = ease;

    ctx.translate(
        position.x,
        position.y + (1 - ease) * 9
    );

    ctx.scale(
        0.65 + ease * 0.35,
        0.65 + ease * 0.35
    );

    ctx.font = `bold ${fontSize}px Georgia`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const colors = [
        "#ffe1f2",
        "#f3b9dc",
        "#eacb92",
        "#e6c1ef"
    ];

    ctx.fillStyle = colors[index % colors.length];

    ctx.shadowColor = "#e6a4df";
    ctx.shadowBlur = 10;

    ctx.fillText(
        words[index],
        0,
        0
    );

    ctx.restore();
}

// Center heart

function drawHeart(cx, cy, time) {

    const pulse =
        1 + Math.sin(time / 250) * 0.08;

    ctx.save();

    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    ctx.font = "bold 33px Georgia";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#f2b6dc";
    ctx.shadowColor = "#e58acb";
    ctx.shadowBlur = 20;

    ctx.fillText("♥", 0, 0);

    ctx.restore();
}

// Small decorative glow in center

function drawCenter(cx, cy, radius) {

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 0.13,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "rgba(238,190,222,0.25)";
    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e6c88e";
    ctx.font = "10px Georgia";

    ctx.fillText(
        "MADE WITH LOVE",
        cx,
        cy + radius * 0.19
    );
}

// Main animation

function animate(time) {

    const cx = width / 2;
    const cy = height / 2;

    const radius = Math.min(width, height) * 0.39;

    drawBackground(time);

    // Reveal words one by one over five seconds

    const elapsed = time - startTime;

    visibleWords = Math.min(
        TOTAL_WORDS,
        Math.floor(
            elapsed / (TOTAL_TIME / TOTAL_WORDS)
        ) + 1
    );

    // Draw the words that have appeared

    for (let i = 0; i < visibleWords; i++) {

        drawWord(
            i,
            cx,
            cy,
            radius,
            time
        );
    }

    // Center decoration

    drawCenter(cx, cy, radius);
    drawHeart(cx, cy, time);

    // Restart after the flower is complete

    if (visibleWords >= TOTAL_WORDS) {

        if (finishedAt === 0) {
            finishedAt = time;
        }

        if (time - finishedAt >= RESTART_DELAY) {

            startTime = time;
            finishedAt = 0;
            visibleWords = 0;
        }
    }

    requestAnimationFrame(animate);
}

// Start

window.addEventListener("resize", resize);

resize();

startTime = performance.now();

requestAnimationFrame(animate);

</script>

</body>
</html>
